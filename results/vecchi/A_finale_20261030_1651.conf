# A_finale.conf — gruppo A: la soluzione finale al crescere di M e N.
#
#   Domanda: quanto va il progetto (MPI + CUDA) sulle dimensioni richieste
#   dalla traccia: M e N crescenti, 3 rapporti M/N (compreso M = N), i k
#   della traccia. Solo il kernel GPU migliore (scelto con il gruppo B e
#   scritto in migliore.conf), solo double.
#   4 dimensioni x 3 forme x 5 k = 60 esecuzioni. Da lanciare DOPO il gruppo B.
#
# Formato (vale per tutti i file di questa cartella): variabili bash, le
# liste sono separate da spazi. Ogni esecuzione è una combinazione di un
# valore per ciascuna lista.

source bench/config/migliore.conf

NAME=A_finale

BACKENDS="cuda"              # versioni da misurare: cuda (MPI + CUDA), cpu (solo MPI)
PRECS="double"               # double, float

# Dimensione di base S e forme (vedi campagna.sh):
#   square: M = N = S     m3n: M = 3S, N = S     n2m: M = S, N = 2S
# Con S = 16384 la matrice più grande (m3n, double) occupa 6,4 GB: entra
# nella GPU (15,5 GB) e nella RAM.
SIZES="2048 4096 8192 16384"
SHAPES="square m3n n2m"

KS="3 6 8 20 32"             # k richiesti dalla traccia

# Kernel (opzione -v). Si può anche dare una lista diversa per precisione:
# KERNELS_<versione>_<precisione> (vedi B_kernel.conf).
KERNELS_cuda="$KERNEL_GPU_MIGLIORE"

# Processi e griglia, nel formato P:Pr:Pc (anche più voci, separate da spazi).
# GPU: un solo processo, che usa l'intera scheda.
LAUNCH_cuda="1:1:1"
MPIRUN_cuda=""               # opzioni aggiuntive di mpirun

MODES="concurrent"           # "concurrent", "serial" (= -S) o entrambe
PADS="1"                     # 1 = righe allineate (padding), 0 = senza padding
REPS=10                      # invocazioni misurate
WARMUP=2                     # invocazioni di riscaldamento

# kernel usati per cuda double: 2
