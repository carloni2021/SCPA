# D_mpi_cpu.conf — gruppo D: come scala la parte MPI (versione CPU).
#
#   16384 x 16384, cpu_block, double, k = 3 e 32 (intensità bassa e alta).
#   11 griglie da 1 a 20 processi, comprese le forme estreme 20x1 e 1x20
#   (solo riduzione di Y / solo broadcast di X).
#   Modalità concorrente (macchina reale) e -S (nodi emulati); con un solo
#   processo solo la concorrente: 11 x 2 x 2 - 2 = 42 esecuzioni.

NAME=D_mpi_cpu

BACKENDS="cpu"
PRECS="double"
SIZES="16384"
SHAPES="square"
KS="3 32"
KERNELS_cpu="1"
LAUNCH_cpu="1:1:1 2:2:1 4:2:2 4:4:1 4:1:4 8:4:2 10:5:2 16:4:4 20:4:5 20:20:1 20:1:20"
MPIRUN_cpu="--map-by core --bind-to core"
MODES="concurrent serial"
PADS="1"
REPS=10
WARMUP=2
WARMUP_TIME=1

# kernel usati per cpu double: 1
