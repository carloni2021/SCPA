# E_mpi_gpu.conf — gruppo E: più processi MPI sull'unica GPU del server.
#
#   16384 x 16384, kernel GPU migliore, double, k = 8.
#   1, 2, 4 processi; concorrente (i processi si alternano sulla GPU) e -S
#   (ognuno la usa da solo: stima di una GPU per nodo). Con un solo
#   processo solo la concorrente: 3 x 2 - 1 = 5 esecuzioni.

source bench/config/migliore.conf

NAME=E_mpi_gpu

BACKENDS="cuda"
PRECS="double"
SIZES="16384"
SHAPES="square"
KS="8"
KERNELS_cuda="$KERNEL_GPU_MIGLIORE"
LAUNCH_cuda="1:1:1 2:2:1 4:2:2"
MPIRUN_cuda=""
MODES="concurrent serial"
PADS="1"
REPS=10
WARMUP=2

# kernel usati per cuda double: 2
