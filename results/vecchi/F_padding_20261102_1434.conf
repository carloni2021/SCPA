# F_padding.conf — gruppo F: quanto rende il padding (righe allineate, -p).
#
#   Dimensioni 2^p - 1: senza padding le righe partono a tutti i
#   disallineamenti possibili; con 8192 o 16384 sarebbero già allineate.
#   GPU (kernel migliore, 1 processo; padding di A e di Xt a 128 byte) e
#   CPU (cpu_block, 20 processi 4x5; padding di A a 64 byte).
#   2 dimensioni x 2 versioni x 3 k x 2 padding = 24 esecuzioni, double.

source bench/config/migliore.conf

NAME=F_padding

BACKENDS="cuda cpu"
PRECS="double"
SIZES="8191 16383"
SHAPES="square"
KS="3 8 32"
KERNELS_cuda="$KERNEL_GPU_MIGLIORE"
KERNELS_cpu="1"
LAUNCH_cuda="1:1:1"
LAUNCH_cpu="20:4:5"
MPIRUN_cuda=""
MPIRUN_cpu="--map-by core --bind-to core"
MODES="concurrent"
PADS="0 1"
REPS=10
WARMUP=2
WARMUP_TIME=1

# kernel usati per cuda double: 2
# kernel usati per cpu double: 1
