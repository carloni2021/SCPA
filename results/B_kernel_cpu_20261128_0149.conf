# B_kernel.conf — gruppo B: confronto dei kernel, quanto vale ogni ottimizzazione.
#
#   16384 x 16384, k della traccia, padding attivo.
#   double: GPU thread_row, warp_row, warp_row_xt, warp_row_smem, cuBLAS (25)
#           CPU cpu_row, cpu_block con 20 processi (10)
#   float : GPU warp_row_xt, warp_row_smem, cuBLAS (15)
#   Totale 50 esecuzioni. Da lanciare PER PRIMO: decide il kernel GPU
#   migliore (da scrivere in migliore.conf) usato dai gruppi A, E e F.
#
# Il float gira sui due candidati (xt e smem), non su "il migliore": il
# migliore si sa solo alla fine di questo gruppo, e in float potrebbe
# essere diverso (in float manca il tetto della potenza FP64).

NAME=B_kernel_cpu

BACKENDS="cpu"
PRECS="double float"
SIZES="16384"
SHAPES="square"
KS="3 6 8 20 32"

# GPU: 0 thread_row, 1 warp_row, 2 warp_row_xt, 3 warp_row_smem, -1 cublas
KERNELS_cuda="0 1 2 3 -1"
KERNELS_cuda_float="2 3 -1"
# CPU: 0 cpu_row, 1 cpu_block; in float nessuna esecuzione
KERNELS_cpu="0 1"
KERNELS_cpu_float=""

LAUNCH_cuda="1:1:1"
LAUNCH_cpu="20:4:5"          # un processo per core
MPIRUN_cuda=""
MPIRUN_cpu="--map-by core --bind-to core"
# Memoria di ogni processo vincolata al suo socket (vedi bench/mem_locale.sh):
# senza, la banda della CPU dipende dalla cache lasciata dagli altri utenti.
WRAP_cpu="bash bench/mem_locale.sh"

MODES="concurrent"
PADS="1"
REPS=10
WARMUP=2
WARMUP_TIME=1

# kernel usati per cpu double: 0 1
# kernel usati per cpu float: 
