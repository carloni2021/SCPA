# E_padding.conf — gruppo E: quanto rende il padding (righe allineate, -p).
#
#   Dimensioni 2^p - 1: senza padding le righe partono a tutti i
#   disallineamenti possibili; con 8192 o 16384 sarebbero già allineate.
#   Solo GPU (kernel migliore, 1 processo; padding di A e di Xt a 128 byte).
#   2 dimensioni x 3 k x 2 padding = 12 esecuzioni, double.

source bench/config/migliore.conf

NAME=E_padding

BACKENDS="cuda"
PRECS="double"
SIZES="8191 16383"
SHAPES="square"
KS="3 8 32"
KERNELS_cuda="$KERNEL_GPU_MIGLIORE"
LAUNCH_cuda="1:1:1"
MPIRUN_cuda=""
MODES="concurrent"
PADS="0 1"
# 30 invocazioni: l'effetto del padding è di pochi punti percentuali,
# con 10 il rumore (fino all'8%) potrebbe nasconderlo o inventarlo.
REPS=30
WARMUP=2
WARMUP_TIME=1
