# migliore.conf — kernel GPU della soluzione finale, letto dalle
# configurazioni dei gruppi A, D ed E (unico punto da modificare).
#
# Si decide con i risultati del gruppo B (B_kernel.conf): va scritto qui il
# kernel con i GFLOPS più alti. Valori: 2 = warp_row_xt, 3 = warp_row_smem.
# Finché B non è stato misurato vale warp_row_xt, il migliore finora.

KERNEL_GPU_MIGLIORE=2
