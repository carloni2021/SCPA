# E_mpi_gpu.conf — gruppo E: MPI sulla versione GPU, con l'unica GPU del server.
#
#   16384 x 16384, kernel GPU migliore, double, k = 8.
#   Griglie: 1x1 (riferimento); 2 processi 2x1 e 1x2; 4 processi 2x2, 4x1, 1x4.
#   Due modalità:
#     - concorrente: i processi si alternano sull'unica GPU (time-slicing),
#       cioè cosa succede davvero su questo server;
#     - -S (nodi emulati): ogni processo usa la GPU da solo nel proprio
#       turno, come se avesse una GPU su un nodo separato. Misura come
#       scalerebbe la soluzione MPI + CUDA e quanto conta la forma della
#       griglia: blocchi locali con più righe o più colonne (efficienza del
#       kernel), volume di broadcast di X e riduzione di Y.
#   Con un solo processo solo la concorrente: 1 + 5 x 2 = 11 esecuzioni.
#   Limite: in -S le comunicazioni passano dalla memoria del server, non da
#   una rete: stima ottimistica per un cluster vero.

source bench/config/migliore.conf

NAME=E_mpi_gpu

BACKENDS="cuda"
PRECS="double"
SIZES="16384"
SHAPES="square"
KS="8"
KERNELS_cuda="$KERNEL_GPU_MIGLIORE"
LAUNCH_cuda="1:1:1 2:2:1 2:1:2 4:2:2 4:4:1 4:1:4"
MPIRUN_cuda=""
MODES="concurrent serial"
PADS="1"
REPS=10
WARMUP=2
WARMUP_TIME=1
